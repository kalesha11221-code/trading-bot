name: Keep Streamlit Cloud Awake 24/7

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud App
        run: |
          curl -s -L --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://trading-bot-doea47tp79egvycwajfnjq.streamlit.app/" > /dev/null || true
          echo "Pinged Streamlit Cloud successfully at $(date)!"
